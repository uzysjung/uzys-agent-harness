name: ci

# 검증 정책 (2026-05-31): 로컬 `npm run ci` 가 1차 게이트 (.claude/rules/test-policy.md).
# GitHub Actions 는 push/PR 마다 돌지 않고 릴리스 태그(v*) push 시에만 최종 검증 — Actions 사용량 최소화.
# 수동 재실행이 필요하면 workflow_dispatch 로 트리거.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: TypeScript CI (typecheck + lint + test:coverage + build)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      # fetch-depth: 0 = 전체 히스토리 + **태그**. 기본값(1) 이면 체크아웃한 태그 1개만 보여
      # tests/docs-supply-chain.test.ts 의 "CHANGELOG → 태그 역방향 게이트" 가 태그를 못 읽는다
      # (그 상태는 통과가 아니라 '신뢰 불가' 실패로 잡힌다). depth 를 되돌릴 일이 생기면
      # `fetch-tags: true` 를 함께 넣을 것.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Run CI pipeline
        run: npm run ci

      - name: Smoke test (install --track tooling into temp dir)
        shell: bash
        run: |
          tmp=$(mktemp -d)
          node dist/index.js install --track tooling --project-dir "$tmp"
          test -f "$tmp/.claude/CLAUDE.md"
          test -f "$tmp/.claude/.installed-tracks"
          test -f "$tmp/.mcp.json"
          rm -rf "$tmp"
