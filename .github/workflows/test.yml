name: ci

# 검증 정책 (2026-05-31): 로컬 `npm run ci` 가 1차 게이트 (.claude/rules/test-policy.md).
# GitHub Actions 는 push/PR 마다 돌지 않고 릴리스 태그(v*) push 시에만 최종 검증 — Actions 사용량 최소화.
# 수동 재실행이 필요하면 workflow_dispatch 로 트리거.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: TypeScript CI (typecheck + lint + test:coverage + build)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      # fetch-depth: 0 = 전체 히스토리 + **태그**. 기본값(1) 이면 체크아웃한 태그 1개만 보여
      # tests/docs-supply-chain.test.ts 의 "CHANGELOG → 태그 역방향 게이트" 가 태그를 못 읽는다
      # (그 상태는 통과가 아니라 '신뢰 불가' 실패로 잡힌다). depth 를 되돌릴 일이 생기면
      # `fetch-tags: true` 를 함께 넣을 것.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Run CI pipeline
        run: npm run ci

      # 보안 게이트 — **이 job 안에 있는 것이 배선 조건이다.** `publish` 가 `needs: ci` 라
      # 여기서 실패하면 게시가 안 일어난다. 별도 워크플로로 빼면 v26.128.0~131.0 과 같은
      # 형태(검증 red 인데 게시 성공)가 재현된다.
      #
      # 조건이 "critical/high 0" 이 아니라 **baseline 대비 신규 0** 인 이유: 이 저장소가 파는
      # 에이전트는 Bash 를 갖고 훅은 백그라운드 프로세스를 띄운다 — 설계상 high 로 잡히므로
      # 절대 0 은 영원히 성립하지 않는다. 통과할 수 없는 게이트는 아무도 안 돌린다(#237 과
      # 같은 형태로 실제로 한 번 건너뛰었다). audit 도 `--omit=dev` 로 **게시되는 것**만 본다 —
      # 빌드 도구의 취약점은 설치자에게 도달하지 않는다.
      - name: Security gate (baseline regression + shipped deps)
        run: npm run security

      - name: Smoke test (install --track tooling into temp dir)
        shell: bash
        run: |
          tmp=$(mktemp -d)
          node dist/index.js install --track tooling --project-dir "$tmp"
          test -f "$tmp/CLAUDE-uzys-harness.md"
          test -f "$tmp/CLAUDE.md"
          test -f "$tmp/.claude/.installed-tracks"
          test -f "$tmp/.mcp.json"
          rm -rf "$tmp"

  # npm registry publish (v26.72.1, P2-NPM) — 태그 push 시 자동 publish.
  #   목적: `npx -y github:` 가 npm 10(Node 20/22 LTS)에서 GitFetcher 버그로 실패 → registry publish 로
  #   `npx @uzysjung/agent-harness` 가 전 npm 버전 작동 (git-dep pack 미경유).
  #   version 은 태그에서 파생 (단일 CalVer 정합).
  #
  #   **이 job 이 여기 있는 이유 = `needs: ci`**. 별개 워크플로였을 때는 `ci` 가 red 여도
  #   게시가 독립으로 성공했다 — v26.128.0~131.0 에서 `ci` 4연속 red 인 채 npm 이 나갔고 3릴리즈 동안
  #   아무도 못 봤다. `needs:` 는 같은 워크플로 안에서만 성립하므로 job 을 옮기는 것이 배선 조건이다.
  #   install-matrix 는 여전히 별개 워크플로(게시를 막지 않는 fresh-env 회귀 신호).
  #
  # 사전 조건: repo Settings > Secrets > Actions 에 NPM_TOKEN (npm automation token).
  #   미설정 시 publish 단계는 graceful skip (태그 CI 를 red 로 만들지 않음).
  publish:
    name: npm publish (@uzysjung/agent-harness)
    needs: ci
    # 태그 push 에서만 게시. 이 가드가 없으면 workflow_dispatch 수동 CI 실행이 게시를 딸려 돌린다.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # version = 태그 (v 제거). package.json 커밋본과 무관하게 태그가 SSOT.
      - name: set version from tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm run build
      - name: npm publish (skip if NPM_TOKEN absent)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN 미설정 — publish 건너뜀. repo Settings>Secrets 에 NPM_TOKEN 추가 후 재태그."
            exit 0
          fi
          npm publish --access public
          echo "published: @uzysjung/agent-harness@${GITHUB_REF_NAME#v}"

      # G5 (Epic #366 · #367) — **게시 명령이 성공했다 ≠ registry 에 올라갔다.**
      # 위 스텝은 NPM_TOKEN 이 없으면 warning 만 내고 exit 0 한다(graceful skip). 그 조용한
      # 통과가 정확히 이 저장소가 반복해서 다친 형태라, 여기서 **registry 에 실물이 있는지**를
      # 되묻는다. 없으면 red 다 — 토큰 부재든 게시 실패든, 결과는 "안 나갔다"로 같다.
      #
      # 이 스텝은 `publish` job 이 **돌았을 때**만 방어한다. 워크플로 자체가 발동하지 않는
      # 경우(2026-08-27 Actions 장애)는 여기서 못 잡는다 — 그쪽은 `release-audit.yml` 담당이다.
      - name: 게시 결과를 registry 에 되묻는다
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          # npm 자신이 게시 직후 "may take a few minutes to become available" 이라고 적는다.
          # 50초만 기다리던 초판은 **정상 게시된 v26.148.1 을 실패로 보고**했다(#377) — 빨간불이
          # 정상 상태가 되면 아무도 안 보므로(#237), 창을 npm 이 말하는 시간에 맞춘다.
          # `--prefer-online` 은 낡은 packument 를 주는 읽기 캐시 경로를 없앤다.
          ATTEMPTS=20
          INTERVAL=15
          # 대기 시간을 문구에 따로 적지 않는다 — 값에서 유도한다. 두 곳에 적으면 한쪽만
          # 바뀌었을 때 화면이 사실과 다른 시간을 말한다.
          WAITED=$(( ATTEMPTS * INTERVAL / 60 ))
          for i in $(seq 1 "${ATTEMPTS}"); do
            got=$(npm view "@uzysjung/agent-harness@${V}" version --prefer-online 2>/dev/null || true)
            if [ "$got" = "$V" ]; then
              echo "registry 확인: @uzysjung/agent-harness@${V} 실재"
              exit 0
            fi
            echo "registry 미반영 (${i}/${ATTEMPTS}) — ${INTERVAL}초 후 재시도"
            sleep "${INTERVAL}"
          done
          # 관측하지 않은 원인을 단언하지 않는다. 초판은 "게시가 일어나지 않았다"고 적었는데,
          # 바로 위 단계가 `+ @uzysjung/agent-harness@…` 를 찍은 실행에서도 그렇게 적었다 —
          # 그 말을 믿고 재태그하면 이미 게시된 버전에 다시 손대게 된다.
          echo "::error::태그 ${GITHUB_REF_NAME} 를 밀고 ${WAITED}분을 기다렸는데 npm registry 에서 ${V} 가 안 보인다. 위 publish 단계의 출력을 먼저 읽어라 — 게시 자체가 안 일어났는지(NPM_TOKEN 부재·publish 실패) 아니면 반영이 늦는지가 거기 있다. 매일 도는 release-audit 워크플로와 \`npm run release:audit\` 이 같은 질문을 다시 묻는다."
          exit 1
